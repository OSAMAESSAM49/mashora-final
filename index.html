<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d8b7d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشورتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مشورتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface2:#eef3f0; --text:#22332e; --muted:#687a73; --border:#dbe5e0;
  --primary:#3d8b7d; --primary-2:#2f7266; --primary-soft:#dcefe9; --on-primary:#fff;
  --warn:#b7791f; --warn-soft:#fbf1dc; --danger:#c0504d; --danger-soft:#f9e3e2; --ok:#3d8b7d;
  --gold:#d6a23a; --gold-soft:#faf0d9;
  --rose:#c56f84; --rose-soft:#f8e7eb; --lav:#7a73c2; --lav-soft:#ecebf8; --peach:#cf8649; --peach-soft:#fbebdd; --sky:#4889b8; --sky-soft:#e1eef7;
  --shadow:0 1px 2px rgba(30,50,45,.06),0 6px 20px rgba(30,50,45,.06); --radius:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131a18; --surface:#1b2421; --surface2:#222d29; --text:#e2ebe7; --muted:#93a59e; --border:#2d3b36;
  --primary:#6bbfae; --primary-2:#86cfc0; --primary-soft:#1e3a33; --on-primary:#0f1a17;
  --warn:#e3b45a; --warn-soft:#3a3020; --danger:#e57f7b; --danger-soft:#3c2423; --gold:#e6b956; --gold-soft:#3a3120;
  --rose:#e092a5; --rose-soft:#3a2730; --lav:#a59ee6; --lav-soft:#2b2a40; --peach:#e7a676; --peach-soft:#3b2d22; --sky:#7db6e0; --sky-soft:#1f3140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#131a18; --surface:#1b2421; --surface2:#222d29; --text:#e2ebe7; --muted:#93a59e; --border:#2d3b36;
  --primary:#6bbfae; --primary-2:#86cfc0; --primary-soft:#1e3a33; --on-primary:#0f1a17;
  --warn:#e3b45a; --warn-soft:#3a3020; --danger:#e57f7b; --danger-soft:#3c2423; --gold:#e6b956; --gold-soft:#3a3120;
  --rose:#e092a5; --rose-soft:#3a2730; --lav:#a59ee6; --lav-soft:#2b2a40; --peach:#e7a676; --peach-soft:#3b2d22; --sky:#7db6e0; --sky-soft:#1f3140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.accent-rose{--acc:var(--rose);--acc-soft:var(--rose-soft)} .accent-lav{--acc:var(--lav);--acc-soft:var(--lav-soft)}
.accent-peach{--acc:var(--peach);--acc-soft:var(--peach-soft)} .accent-sky{--acc:var(--sky);--acc-soft:var(--sky-soft)}

/* header */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header.top{padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:19px}
nav.tabs{display:flex;gap:4px;margin-inline-start:12px}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
nav.tabs button:hover{background:var(--surface2);color:var(--text)}
nav.tabs button.on{background:var(--primary-soft);color:var(--primary-2);font-weight:700}
.hud{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:14px;white-space:nowrap}
.pill.streak{color:var(--peach)} .pill.off{color:var(--muted)} .pill.lvl{color:var(--primary-2)}
.iconbtn{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:11px;cursor:pointer;display:grid;place-items:center;font-size:17px}
.iconbtn:hover{background:var(--surface2)}
@media (max-width:980px){
  header.top{backdrop-filter:none;background:var(--bg)}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  nav.tabs button{flex-direction:column;gap:0;font-size:12px;padding:6px 8px}
  nav.tabs button .ic{font-size:20px}
  body{padding-bottom:76px}
  .brand .name{display:none}
  .pill.lvl .t{display:none}
}

main{padding:22px 0 40px}
.view{display:none} .view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;line-height:1.3} h2{font-size:21px} h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.soft{background:var(--primary-soft);color:var(--primary-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.up{background:var(--gold-soft);color:var(--text);border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent)}
.btn.up:hover{background:color-mix(in srgb,var(--gold) 28%,var(--surface))}
.btn.big{padding:14px 22px;font-size:17px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.greet h1{font-size:26px;font-weight:800}
.goal{display:flex;align-items:center;gap:20px}
.ring{--p:0;--c:var(--primary);width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none;transition:--p .6s}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:28px;font-weight:800} .ring span{font-size:12px;color:var(--muted)}
.ring.sm{width:46px;height:46px}.ring.sm>div{width:36px;height:36px}.ring.sm b{font-size:12.5px}
.xpbar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:99px;transition:width .6s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800} .stat span{font-size:13px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.types{grid-template-columns:repeat(2,1fr)}}
.tcard{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:start;transition:transform .15s, box-shadow .15s}
.tcard:hover{transform:translateY(-3px)}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--acc)}
.tcard .em{width:46px;height:46px;border-radius:13px;background:var(--acc-soft);display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.tcard .nm{font-weight:700;font-size:16.5px}
.tcard .cnt{color:var(--muted);font-size:13.5px}
.tcard .add{margin-top:12px;display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--acc);font-size:14.5px}
.week{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.week .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .bar i{width:100%;max-width:44px;border-radius:9px 9px 4px 4px;background:var(--primary-soft);min-height:4px;transition:height .5s}
.week .bar.today i{background:var(--primary)}
.week .bar b{font-size:13px} .week .bar span{font-size:11.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px 10px;text-align:center;background:var(--surface2);border:1px dashed var(--border)}
.badge .bi{font-size:28px;filter:grayscale(1);opacity:.45}
.badge .bn{font-weight:700;font-size:13.5px;margin-top:4px}
.badge .bd{font-size:11.5px;color:var(--muted)}
.badge.got{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.badge.got .bi{filter:none;opacity:1}
.notice{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.info{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}

/* form */
.fhead{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.fhead .em{font-size:30px}
.fhead h2{font-size:21px}
.secnav{position:sticky;top:64px;z-index:20;background:var(--bg);padding:10px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.secnav button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.secnav button.done{background:var(--primary-soft);border-color:transparent;color:var(--primary-2);font-weight:700}
.overall{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:2px}
.overall>i{display:block;height:100%;background:var(--acc,var(--primary));transition:width .35s}
.sec{scroll-margin-top:130px}
.sec .sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec .sh .em{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);display:grid;place-items:center;font-size:19px}
.sec .sh .cnt{margin-inline-start:auto;font-size:13.5px;color:var(--muted);font-weight:700}
.sec.complete .sh .cnt{color:var(--primary-2)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label{font-weight:700;font-size:14.5px;display:flex;gap:6px;align-items:center}
.f>label .hint{font-weight:400;color:var(--muted);font-size:12.5px}
.f>label .autotag{display:none;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 7px;border-radius:99px}
.f.auto>label .autotag{display:inline-block}
.f.hide{display:none}
.inp{width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s, box-shadow .15s;min-height:44px}
.inp:focus{border-color:var(--acc,var(--primary));box-shadow:0 0 0 4px color-mix(in srgb,var(--acc,var(--primary)) 18%,transparent)}
.f.filled .inp{background:var(--surface2)}
.f.auto .inp{border-color:color-mix(in srgb,var(--gold) 60%,var(--border))}
textarea.inp{min-height:70px;resize:vertical}
select.inp{cursor:pointer}
.inp.ltr{direction:ltr;text-align:right;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:44px;transition:all .12s}
.chip:hover{border-color:var(--acc,var(--primary))}
.chip.on{background:var(--acc,var(--primary));border-color:var(--acc,var(--primary));color:#fff;font-weight:700}
.chip.no.on{background:var(--muted);border-color:var(--muted)}
.info{font-size:13px;color:var(--muted);min-height:0}
.info.ok{color:var(--primary-2)} .info.warn{color:var(--warn)} .info.bad{color:var(--danger)}
.topics{display:flex;flex-direction:column;gap:2px}
.topic{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px}
.topic:nth-child(odd){background:var(--surface2)}
.topic .tl{flex:1;font-size:15px}
.topic .tn{width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.topic.set .tn{background:var(--acc);color:#fff;border-color:transparent}
.topic .chip{padding:6px 12px;min-height:36px;font-size:14px}
.savebar{position:sticky;bottom:0;z-index:25;margin-top:18px;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
@media (max-width:980px){.savebar{bottom:66px}}
@media (max-width:600px){.savebar .card{gap:8px;padding:10px}.savebar .btn.big{padding:10px 16px;font-size:15.5px}#sbTxt{display:none}.savebar .btn.ghost{display:none}.fhead h2{font-size:18px}}
.savebar .card{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.banner{display:none}.banner.on{display:flex}

/* lists */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.clist{display:flex;flex-direction:column;gap:10px}
.citem{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--acc)}
.citem .em{font-size:24px}
.citem .nm{font-weight:700}
.citem .meta{font-size:13px;color:var(--muted)}
.citem .acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .e{font-size:44px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:600px){.counts{grid-template-columns:repeat(2,1fr)}}
.counts div{background:var(--acc-soft);border-radius:12px;padding:8px 10px;font-size:13.5px}
.counts b{display:block;font-size:20px;color:var(--acc)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ex-grid .card h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.dz{border:2px dashed var(--border);border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--primary);background:var(--primary-soft)}

/* toast + confetti + modal */
#toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.15);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;animation:tin .3s ease;width:100%}
.toast.warn{border-color:var(--warn)} .toast.gold{background:var(--gold-soft);border-color:var(--gold)}
.toast .ti{font-size:22px}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.xpfloat{position:fixed;z-index:101;font-weight:800;font-size:26px;color:var(--gold);pointer-events:none;animation:xpf 1.4s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,.15)}
@keyframes xpf{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-70px)}}
dialog{border:1px solid var(--border);border-radius:18px;background:var(--surface);color:var(--text);padding:22px;max-width:min(92vw,460px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
@media (max-width:520px){
  .wrap{padding:0 12px} main{padding-top:14px}
  .topic{flex-wrap:wrap;gap:6px 10px} .topic .tl{flex:1 1 calc(100% - 40px)} .topic .chips{margin-inline-start:36px}
  .citem{flex-wrap:wrap} .citem .acts{width:100%;margin:0} .citem .acts .btn{flex:1}
  .greet h1{font-size:22px} .goal{flex-wrap:wrap;gap:14px} .ring{width:104px;height:104px} .ring>div{width:82px;height:82px}
  .stats3 .stat b{font-size:19px} .fields{grid-template-columns:1fr}
  .toolbar .inp{flex:1 1 100%} .ex-grid{grid-template-columns:1fr}
  .hud{gap:6px} .pill{padding:4px 9px}
  .savebar .card{flex-wrap:nowrap;gap:6px} .savebar .btn{padding:10px 11px;font-size:14.5px;white-space:nowrap} .savebar .btn.big{padding:10px 13px;font-size:15px}
}
.share-opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="logo">🌿</div><span class="name">مشورتي</span></div>
  <nav class="tabs" id="tabs">
    <button data-go="home"><span class="ic">🏠</span><span>الرئيسية</span></button>
    <button data-go="new"><span class="ic">➕</span><span>حالة جديدة</span></button>
    <button data-go="cases"><span class="ic">📋</span><span>الحالات</span></button>
    <button data-go="export"><span class="ic">📤</span><span>التصدير</span></button>
    <button data-go="settings"><span class="ic">⚙️</span><span>الإعدادات</span></button>
  </nav>
  <div class="hud">
    <span class="pill off" id="hudOff" title="شغال من غير نت — كل حاجة متاحة" hidden>📴 أوفلاين</span>
    <span class="pill streak" id="hudStreak" title="أيام متتالية">🔥 0</span>
    <span class="pill lvl" id="hudLvl" title="المستوى">⭐ <span class="t">مستوى</span> 1</span>
    <button class="iconbtn" id="themeBtn" title="تغيير المظهر">🌓</button>
  </div>
</div></header>

<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-new"></section>
  <section class="view" id="v-form"></section>
  <section class="view" id="v-cases"></section>
  <section class="view" id="v-export"></section>
  <section class="view" id="v-settings"></section>
</main>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<dialog id="dlg"></dialog>
<input type="file" id="upAny" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>

<script>
/* مشورتي — core: schema + zip + xlsx fill/parse (works in browser and Node 18+) */
(function (G) {
  'use strict';

  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

const GOVS = { '01': 'القاهرة', '02': 'الإسكندرية', '03': 'بورسعيد', '04': 'السويس', '11': 'دمياط', '12': 'الدقهلية', '13': 'الشرقية', '14': 'القليوبية', '15': 'كفر الشيخ', '16': 'الغربية', '17': 'المنوفية', '18': 'البحيرة', '19': 'الإسماعيلية', '21': 'الجيزة', '22': 'بني سويف', '23': 'الفيوم', '24': 'المنيا', '25': 'أسيوط', '26': 'سوهاج', '27': 'قنا', '28': 'أسوان', '29': 'الأقصر', '31': 'البحر الأحمر', '32': 'الوادي الجديد', '33': 'مطروح', '34': 'شمال سيناء', '35': 'جنوب سيناء', '88': 'خارج الجمهورية' };
function parseNID(v) {
  const n = normDigits(v).replace(/\D/g, '');
  if (!n) return null;
  if (n.length !== 14) return { err: `${n.length} رقم من 14` };
  const cent = n[0] === '2' ? 1900 : n[0] === '3' ? 2000 : 0;
  if (!cent) return { err: 'أول رقم لازم يكون 2 أو 3' };
  const y = cent + +n.slice(1, 3), m = +n.slice(3, 5), d = +n.slice(5, 7);
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return { err: 'تاريخ الميلاد داخل الرقم القومي مش صحيح' };
  if (dt > new Date()) return { err: 'تاريخ الميلاد في المستقبل!' };
  return { dob: iso(dt), gov: GOVS[n.slice(7, 9)] || '', male: (+n[12]) % 2 === 1 };
}
function ageYears(dob, ref) { const a = parseIso(dob), b = parseIso(ref); let y = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--; return y; }
function ageMD(dob, ref) {
  const a = parseIso(dob), b = parseIso(ref); if (b < a) return null;
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); let d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  return { m, d, days: Math.round((b - a) / 864e5) };
}

}

// fingerprint of a file's bytes, to notice the very same file being uploaded twice
// Every row of every file is imported exactly as it is and in the same order — repeated national IDs, names,
// partners, children, even identical rows and the same file twice: all added. Nothing is asked or skipped.
async function importFiles(files) {
  if (!files.length) return;
  const batch = uid(); let added = 0, blanks = 0; const bad = [], per = [];
  for (const f of files) {
    try {
      const rows = await C.parseWorkbook(new Uint8Array(await f.arrayBuffer()), TEMPLATE); const t0 = Date.now();
      // registration day: visit date, else first-meeting date (text dates like 7\10\2026 understood too).
      // A row without a readable date takes the day of the row above it in the same sheet (else the one below).
      const own = rows.map(r => dayFromAny(r.data[visitField(sheetOf(r.type))]) || dayFromAny(r.data.J));
      const known = own.filter(Boolean).sort(), fileMid = known[known.length >> 1] || today();
      const dayAt = i => {
        if (own[i]) return own[i];
        for (let j = i - 1; j >= 0; j--) if (rows[j].type === rows[i].type && own[j]) return own[j];
        for (let j = i + 1; j < rows.length; j++) if (rows[j].type === rows[i].type && own[j]) return own[j];
        return fileMid;
      };
      let fb = 0;
      rows.forEach((r, i) => {
        const c = { id: uid(), type: r.type, day: dayAt(i), data: r.data, auto: [], created: t0 + i, updated: t0 + i, imported: f.name, batch };
        if (own[i]) c.ownDate = true;
        if (r.blank) { c.blank = true; fb++; }
        c.pct = pctOf(c); DB.cases.push(c);
      });
      added += rows.length; blanks += fb;
      per.push(`📄 ${escH(f.name)}: <b>${rows.length}</b> صف${fb ? ` (منهم ${fb} صف فيه بيانات المنشأة بس من غير بيانات حالة)` : ''} — ${SHEETS.map(sh => `${sh.short} ${rows.filter(r => r.type === sh.key).length}`).join(' · ')}`);
    } catch (e) { console.error(e); bad.push(f.name); }
  }
  save(); refreshHud(); renderExport();
  $('#impRes').innerHTML = `✅ اتضاف <b>${added}</b> صف — كل اللي في الملف${files.length > 1 ? 'ات' : ''} زي ما هو${bad.length ? ` · ⚠️ ملفات مقرتش: ${bad.map(escH).join('، ')}` : ''}
    <div class="muted" style="margin-top:4px">${per.join('<br>')}</div>
    <div class="muted" style="margin-top:4px">كل صف اتسجل على تاريخ الزيارة بتاعه (أو تاريخ أول لقاء)، والصف اللي مفيهوش تاريخ أخد يوم الصف اللي قبله. تقدر تعدّل على أي حالة من صفحة الحالات.</div>
    ${dateWarnings(batch)}
    ${added ? `<button class="btn sm danger" style="margin-top:8px" onclick="undoImport('${batch}')">↩️ تراجع عن الرفع ده</button>` : ''}`;
  if (added) toast('🔗', `اتضاف ${added} صف من ${files.length > 1 ? 'الملفات' : 'الملف'}`);
}

const fullDate = d => parseIso(d).toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
// lenient reading of a date cell: ISO, d/m/yyyy with any separator (/ \ - . space), or digits typed without separators
function dayFromAny(v) {
  if (v === null || v === undefined || v === '') return null;
  const s = normDigits(String(v)).trim(); if (isIsoDate(s)) return s;
  let y, mo, d, m;
  if ((m = s.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})$/))) [y, mo, d] = [m[1], m[2], m[3]];
  else if ((m = s.match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{4})$/))) [d, mo, y] = [m[1], m[2], m[3]];
  else {
    const g = s.replace(/\D/g, '');
    if (g.length === 8) [d, mo, y] = [g.slice(0, 2), g.slice(2, 4), g.slice(4)];
    else if (g.length === 7) [d, mo, y] = +g.slice(1, 3) <= 12 ? [g[0], g.slice(1, 3), g.slice(3)] : [g.slice(0, 2), g[2], g.slice(3)];

  }

  if (y < 2000 || y > 2100 || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;

function dateWarnings(batch) {

  const g = {}; for (const c of cs) if (c.ownDate) g[c.day] = (g[c.day] || 0) + 1;

  return far.map(([d, n]) => `<div class="notice" style="margin-top:8px"><span>⚠️</span><div class="spacer"><b>${n}</b> حالة على يوم <b>${fullDate(d)}</b> — بعيد عن باقي حالات الملف، غالباً التاريخ متكتب غلط في الإكسيل. الحالات دي مش هتدخل في تجميعة فترة مش شاملة اليوم ده (لكن هتدخل في "تصدير كل الحالات").</div><button class="btn sm ghost" onclick="showDay('${d}')">عرض</button><button class="btn sm" onclick="moveDay('${batch}','${d}')">انقلهم ليوم…</button></div>`).join('');

  <h2 style="margin-bottom:14px">⚙️ الإعدادات</h2>
  <div class="grid">
    <div class="card"><h3 style="margin-bottom:4px">🏥 بيانات المنشأة ومقدمة المشورة</h3><p class="muted small" style="margin-top:0">بتتكتب مرة واحدة وبتتملى أوتوماتيك في أول أعمدة كل حالة</p>
      <div class="kv">${C.PROVIDER.map(f => `<div class="f"><label>${f.l}</label><input class="inp ${f.t === 'phone' ? 'ltr' : ''}" data-prov="${f.c}" value="${escH(p[f.c] || '')}" ${f.t === 'phone' ? 'inputmode="numeric" maxlength="11"' : ''}></div>`).join('')}</div></div>
    <div class="card"><h3 style="margin-bottom:12px">🎯 التفضيلات</h3>
      <div class="kv">
        <div class="f"><label>اسمك (للترحيب)</label><input class="inp" id="sName" value="${escH(DB.settings.name)}"></div>
        <div class="f"><label>هدف الحالات اليومي</label><input class="inp" id="sGoal" type="number" min="1" max="200" value="${DB.settings.goal}"></div>
        <div class="f"><label>المظهر</label><div class="seg" id="sTheme"><button data-v="auto">تلقائي</button><button data-v="light">فاتح</button><button data-v="dark">غامق</button></div></div>
      </div></div>
    <div class="card"><h3 style="margin-bottom:4px">🛡️ النسخ الاحتياطي</h3>
      <p class="muted small" style="margin-top:0">الحالات متخزنة على المتصفح ده. خد نسخة احتياطية بانتظام، ولو هتنقل لجهاز تاني رجّع النسخة هناك.${DB.lastBackup ? ` آخر نسخة: ${new Date(DB.lastBackup).toLocaleString('ar-EG')}` : ''}</p>
      <div class="row"><button class="btn" onclick="backup()">⬇️ تحميل نسخة احتياطية</button><label class="btn ghost" style="cursor:pointer">⬆️ استرجاع نسخة<input type="file" accept=".json,application/json" hidden id="restoreIn"></label>
      <span class="spacer"></span><button class="btn danger" onclick="wipe()">🗑️ مسح كل البيانات</button></div></div>
  </div>`;
  $$('#v-settings [data-prov]').forEach(i => i.oninput = () => { let v = i.value; if (i.classList.contains('ltr')) { v = normDigits(v).replace(/\D/g, ''); i.value = v; } DB.settings.provider[i.dataset.prov] = v.trim(); save(); });
  $('#sName').oninput = e => { DB.settings.name = e.target.value.trim(); save(); };
  $('#sGoal').oninput = e => { const n = parseInt(normDigits(e.target.value)); if (n > 0) { DB.settings.goal = n; save(); } };
  const th = $('#sTheme'); $$('button', th).forEach(b => b.classList.toggle('on', b.dataset.v === DB.settings.theme));
  th.onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; DB.settings.theme = b.dataset.v; save(); applyTheme(); $$('button', th).forEach(x => x.classList.toggle('on', x === b)); };
  $('#restoreIn').onchange = restore;
}
function backup() {
  const u8 = new TextEncoder().encode(JSON.stringify({ app: 'mshora', v: 1, at: new Date().toISOString(), db: DB }, null, 1));
  deliver(u8, `مشورتي_نسخة_احتياطية_${today()}.json`, 'application/json', '🛡️ النسخة الاحتياطية جاهزة');
  DB.lastBackup = Date.now(); DB.game.backups = (DB.game.backups || 0) + 1; save(); checkBadges();
  toast('🛡️', 'اتحملت النسخة الاحتياطية — احتفظ بيها في مكان آمن');
  if (current === 'home') renderHome();
}
async function restore(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const d = j.db || j; if (!Array.isArray(d.cases)) throw new Error('bad');
    const ids = new Set(DB.cases.map(c => c.id)); let n = 0;
    for (const c of d.cases) if (!ids.has(c.id)) { DB.cases.push(c); n++; }
    if (!DB.settings.provider.F && d.settings) DB.settings = { ...DB.settings, ...d.settings };
    for (const [k, v] of Object.entries((d.game || {}).badges || {})) if (!DB.game.badges[k]) DB.game.badges[k] = v;
    save(); refreshHud(); toast('✅', `اترجعت ${n} حالة`); renderSettings();
  } catch (err) { toast('⚠️', 'الملف ده مش نسخة احتياطية صحيحة', 'warn'); }
}
async function wipe() {
  if (!await confirmDlg('مسح كل البيانات؟', 'هيتم مسح كل الحالات والأوسمة من المتصفح ده. اتأكد إنك عامل نسخة احتياطية الأول.', 'مسح الكل', true)) return;
  const s = DB.settings; DB = defaults(); DB.settings = s; save(); clearDraft(); refreshHud(); toast('🗑️', 'اتمسحت البيانات'); go('home');
}
function applyTheme() { const t = DB.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
$('#themeBtn').onclick = () => {
  const dark = DB.settings.theme === 'dark' || (DB.settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  DB.settings.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};

/* ================= upload from home ================= */
function pickUpload() { const i = $('#upAny'); i.value = ''; i.click(); }
$('#upAny').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  await go('export'); await importFiles(files);
  const r = $('#impRes'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

/* ================= install / offline ================= */
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (current === 'home') renderHome(); });
addEventListener('appinstalled', () => { installPrompt = null; toast('📲', 'اتثبت التطبيق — هتلاقيه على الشاشة الرئيسية'); if (current === 'home') renderHome(); });
async function doInstall() { if (!installPrompt) return; installPrompt.prompt(); try { await installPrompt.userChoice; } catch (e) { } installPrompt = null; if (current === 'home') renderHome(); }
function installDismissed() { return store.get('mshora_install_x') === '1'; }
function dismissInstall() { store.set('mshora_install_x', '1'); renderHome(); }
function updateOnline() { $('#hudOff').hidden = navigator.onLine; }
addEventListener('online', updateOnline); addEventListener('offline', updateOnline);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('✨', 'نزلت نسخة جديدة من التطبيق — <a href="#" onclick="location.reload();return false" style="color:var(--primary-2);font-weight:700">تحديث الآن</a>');
  });
}

/* ================= boot ================= */
(async function boot() {
  applyTheme();
  if (typeof DecompressionStream === 'undefined' || typeof CompressionStream === 'undefined') {
    document.querySelector('main').innerHTML = '<div class="card" style="margin-top:20px">⚠️ المتصفح ده قديم. افتح الملف بـ Google Chrome أو Microsoft Edge بعد التحديث.</div>'; return;
  }
  const bin = atob(TEMPLATE_B64); TEMPLATE = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) TEMPLATE[i] = bin.charCodeAt(i);
  L = await C.readTemplateLists(TEMPLATE);
  refreshHud(); updateOnline(); go('home');
})();
</script>
</body>
</html>
